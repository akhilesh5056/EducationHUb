    <div class="section-contact">
        <div class="container">
            <h2 class="section-common-heading">Contact Us</h2>
            <p class="section-common-subheading">Get in touch with us.We are always here to help you.</p>
        </div>
    </div>

    <section class="section-contact">
        <div class="contact grid grid-two-cols">
            <div class="contact-content">
                <form action="#">
                    <div class="grid grid-two-cols mb-3">
                        <div>
                            <label for="username">username</label>
                            <input type="text" name="username" id="username" autocomplete="off" required
                                placeholder="enter your name">
                        </div>
                        <div>
                            <label for="email">Email</label>
                            <input type="email" name="email" id="email" autocomplete="off" required
                                placeholder="enter your Email">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="subject">Subject</label>
                        <input type="text" name="subject" id="subject" placeholder="Your Subject">
                    </div>
                    <div class="mb-3">
                        <label for="message">Message</label>
                        <textarea name="message" id="message" cols="30" rows="10"
                            placeholder="enter your message"></textarea>
                    </div>
                    <div>
                        <button type="submit" class="btn btn-submit">send message</button>
                    </div>

                </form>
            </div>
            <div class="location-image">
                <img  src="/Final Project/images/HILmr.png" width="390" height="400" alt="street view">
            </div>
        </div>
    </section>
